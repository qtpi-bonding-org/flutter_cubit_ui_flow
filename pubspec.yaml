name: cubit_ui_flow
description: Cubit state to UI feedback orchestration for Flutter. Contracts-based architecture with automatic loading and error handling.
version: 0.2.0
homepage: https://github.com/quanitya/flutter_cubit_ui_flow
repository: https://github.com/quanitya/flutter_cubit_ui_flow
issue_tracker: https://github.com/quanitya/flutter_cubit_ui_flow/issues
documentation: https://github.com/quanitya/flutter_cubit_ui_flow/blob/main/INTEGRATION_GUIDE.md

topics:
  - flutter
  - cubit
  - bloc
  - state-management
  - ui-feedback
  - loading
  - error-handling

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.0
  meta: ^1.9.0
  # These back the custom_lint plugin exported from lib/cubit_ui_flow.dart
  # (via lib/custom_lint.dart -> lib/cubit_ui_flow_lints.dart). They must be
  # regular dependencies, not dev_dependencies: dev_dependencies of a
  # git/path-dependency package are invisible to downstream consumers' pub
  # resolution, so a consuming app's `dart run custom_lint` could never
  # resolve these imports if they stayed dev-only.
  analyzer: ^9.0.0
  custom_lint_builder: ^0.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.0
